<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gym management app: members, subscriptions, payments, invoices, WhatsApp & SMS reminders">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="نادي جيم">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>نادي جيم — إدارة النادي الرياضي</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0f766e; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: #fff; font-family: Tahoma, Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    #splash .ring { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%;
      animation: spin 1s linear infinite; }
    #splash h1 { font-size: 22px; margin: 0; }
    #splash p { margin: 0; opacity: .85; font-size: 14px; max-width: 360px; line-height: 1.6; }
    #splash .err { background: #fff; color: #b91c1c; border-radius: 8px; padding: 10px; font-size: 12px; direction: ltr;
      max-width: 90vw; overflow: auto; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- شاشة تحميل بدل الصفحة البيضاء: أول فتح يحمّل حوالي 10 ميجا ثم يُحفظ في المتصفح -->
  <div id="splash">
    <div class="ring"></div>
    <h1>نادي جيم</h1>
    <p id="splash-msg">جاري التحميل… أول مرة قد تستغرق دقيقة حسب سرعة الإنترنت، وبعدها يفتح فوراً.</p>
    <div class="err" id="splash-err"></div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var msg = document.getElementById('splash-msg');
      var err = document.getElementById('splash-err');
      window.addEventListener('flutter-first-frame', function () { splash.remove(); });
      function showError(text) {
        if (!document.body.contains(splash)) return;
        err.style.display = 'block';
        err.textContent = String(text).slice(0, 500);
        msg.textContent = 'حدث خطأ أثناء التحميل. حدّث الصفحة (Ctrl+Shift+R)، وإن تكرر أرسل صورة هذه الرسالة للدعم:';
      }
      window.addEventListener('error', function (e) { showError(e.message || e.error); });
      window.addEventListener('unhandledrejection', function (e) { showError(e.reason && (e.reason.message || e.reason)); });
      setTimeout(function () {
        if (document.body.contains(splash) && err.style.display !== 'block') {
          msg.textContent = 'ما زال التحميل جارياً (الإنترنت بطيء). انتظر قليلاً، أو حدّث الصفحة (Ctrl+Shift+R).';
        }
      }, 60000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
